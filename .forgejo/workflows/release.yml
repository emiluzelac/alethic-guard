name: Release qualification
on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: Published Alethic kernel version for the release candidate
        required: true
        type: string
permissions:
  contents: read

jobs:
  published-kernel:
    runs-on: [self-hosted, linux, x64, iam-ci-isolated]
    container: python:3.12-bookworm
    steps:
      - name: Check out verified commit
        env:
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="Authorization: token $TOKEN" \
            git fetch -q --depth 1 "$SERVER/$REPOSITORY.git" "$COMMIT"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: Test the published kernel wheel
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
        run: |
          python -c 'import os, re; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", os.environ["KERNEL_VERSION"])'
          python -m pip install '.[test]' --only-binary alethic-kernel "alethic-kernel==$KERNEL_VERSION"
          python -m pytest
