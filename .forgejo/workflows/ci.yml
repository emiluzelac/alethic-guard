name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  python:
    runs-on: [self-hosted, linux, x64, iam-ci-isolated]
    strategy:
      matrix:
        python: ['3.11', '3.12']
    container: python:${{ matrix.python }}-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install '.[test]'
      - run: python -m pytest
      - run: alethic-guard profile validate policy/examples/offline-research.yaml
