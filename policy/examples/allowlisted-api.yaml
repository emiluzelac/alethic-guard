api_version: guard.alethic.dev/v1
kind: WorkloadPolicy
metadata:
  name: broker-lab
spec:
  profile: allowlisted-api
  isolation: vm-isolated
  enforce: true
  default_action: deny
  filesystem:
    inputs:
      - path: /data/approved
        access: read_only
    outputs:
      - path: /data/results
        access: read_write
    host_home_mount: deny
    shared_clipboard: deny
    sync_services: deny
  network:
    guest_direct_egress: deny_all
    guest_inbound: deny_all
    dns: deny
    ipv6: deny
    approved_broker_destinations: ["https://collector.example/v1/fixture"]
  tools:
    allowed: [local_inference, local_read, local_write_results, collector.publish]
    shell: deny
    external_http: deny
  emergency:
    on_policy_engine_unavailable: deny_new_effects
    on_controller_unavailable: deny_new_effects
    restart_after_containment: require_manual_release
  evidence:
    host_side_events: required
    include_sensitive_payloads: false
