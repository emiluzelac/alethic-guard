[package]
name = "alethic-guard-gateway"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
alethic-guardd = { path = "../daemon" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["serde"] }
webpki-roots = "1"
