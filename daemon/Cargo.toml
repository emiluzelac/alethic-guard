[package]
name = "alethic-guardd"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
libc = "0.2"
jsonschema = { version = "0.30", default-features = false }
roxmltree = "0.21"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
